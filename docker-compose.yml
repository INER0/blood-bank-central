services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloodbank
      POSTGRES_USER: bloodbank
      POSTGRES_PASSWORD: bloodbank
    ports:
      - "5432:5432"
    volumes:
      - bloodbank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodbank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bloodbank_data:
